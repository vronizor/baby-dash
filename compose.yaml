services:
  baby-dash:
    build: .
    image: baby-dash:latest
    container_name: baby-dash
    restart: unless-stopped
    env_file: .env
    networks:
      - babybuddy
    ports:
      - "${DASH_BIND:-127.0.0.1}:${DASH_PORT:-8090}:8080"

networks:
  babybuddy:
    external: true
    name: ${BB_NETWORK:-babybuddy_default}
