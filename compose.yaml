services:
  baby-dash:
    build: .
    image: baby-dash:latest
    container_name: baby-dash
    restart: unless-stopped
    env_file: .env
    networks:
      - babybuddy
    # No published port: Caddy reaches baby-dash:8080 over a shared Docker network.
    # If Caddy runs on the host instead, publish loopback only:
    # ports:
    #   - "127.0.0.1:8080:8080"

networks:
  babybuddy:
    external: true
    name: ${BB_NETWORK:-babybuddy_default}
